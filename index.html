<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Une seule adresse pour l'app (audit C-111) : les adresses techniques Firebase renvoient vers arvela.fr.
      (function () {
        var h = location.hostname;
        if ((/\.web\.app$/.test(h) || /\.firebaseapp\.com$/.test(h)) && location.pathname.indexOf('/__/') !== 0) {
          location.replace('https://arvela.fr' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arvela</title>
    <meta name="description" content="Le carnet de bord de l'assistante maternelle : pointage, carnet de liaison, paie Pajemploi, congés. Données sur le téléphone, avec une copie dans ton compte." />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1324" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arvela" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Arvela a besoin de JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

# Dependabot (audit, avant l'ouverture au public) : GitHub surveille les briques du code
# (paquets npm et actions GitHub) et ouvre une demande de fusion quand une mise à jour existe.
# Les failles de sécurité déclenchent une demande tout de suite ; le reste est regroupé une fois par mois
# pour limiter le bruit. Chaque demande passe les mêmes contrôles obligatoires (tests, règles Firestore)
# avant de pouvoir être fusionnée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Mise à jour"
    groups:
      paquets:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Mise à jour"
    groups:
      actions:
        patterns: ["*"]

# Publication sur GitHub Pages.
# - branche main : la version de travail, à la racine du site
# - branche base-claude-code-v1 : la base enregistrée (version Claude Code intacte), sous /cc/
name: Publier le site
on:
  push:
    branches: [main, base-claude-code-v1]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version de travail (main)
        working-directory: main
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm test
          npm run build
      - uses: actions/checkout@v4
        with:
          ref: base-claude-code-v1
          path: base
      - name: Base enregistrée sous /cc/
        continue-on-error: true
        working-directory: base
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          mkdir -p ../main/dist/cc
          cp -r dist/. ../main/dist/cc/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

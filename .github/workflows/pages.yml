# Publication sur GitHub Pages.
# - branche main : l'app de référence, à la racine du site
# - branche version-claude-code : la version concurrente, sous /cc/ (si elle existe et se construit)
name: Publier le site
on:
  push:
    branches: [main, version-claude-code]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: App de référence (main)
        working-directory: main
        run: |
          npm ci
          npx tsc --noEmit -p .
          bun test tests
          node build.mjs
      - name: Version concurrente présente ?
        id: cc
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin version-claude-code >/dev/null; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cc.outputs.present == 'true'
        with:
          ref: version-claude-code
          path: cc
      - name: Version concurrente (version-claude-code) sous /cc/
        if: steps.cc.outputs.present == 'true'
        continue-on-error: true
        working-directory: cc
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          mkdir -p ../main/dist/cc
          cp -r dist/. ../main/dist/cc/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

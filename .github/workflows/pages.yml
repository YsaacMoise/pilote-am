# Publication de la version de travail (branche main) sur Firebase Hosting (arvela.fr).
# GitHub Pages ne sert plus qu'une page de redirection vers arvela.fr (audit C-110).
# Les versions archivées ne sont jamais publiées.
# Actions épinglées par empreinte exacte et firebase-tools figé (audit C-044, C-112).
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Version de travail (main)
        working-directory: main
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm test
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: main/dist
          retention-days: 3
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Matrice des règles Firestore (rien n'est publié si un cas échoue)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"; export PATH="$JAVA_HOME/bin:$PATH"
          npx firebase emulators:exec --only firestore --project demo-arvela "node tests/rules/rules.test.mjs"
  firebase:
    needs: [build, regles]
    runs-on: ubuntu-latest
    # Publication sans clé stockée (04/11/2026) : GitHub prouve à Google que la demande vient de ce dépôt,
    # Google rend un laissez-passer d'une heure pour le compte github-publication, qui n'a que le droit
    # de publier le site (Firebase Hosting Admin et lecture des clés d'API). Plus aucune clé dans les secrets.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # firebase-tools vient du fichier de verrouillage (versions figées), sans scripts d'installation :
      # aucun paquet téléchargé à la volée ne tourne pendant que le laissez-passer Google est présent.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: dist
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/371665732009/locations/global/workloadIdentityPools/github/providers/pilote-am
          service_account: github-publication@arvela-app.iam.gserviceaccount.com
      - name: Publier sur arvela.fr
        run: npx --no-install firebase deploy --only hosting --project arvela-app --non-interactive
  redirection-github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages-redirection
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

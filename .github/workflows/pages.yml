# Publication de la version de travail (branche main) sur Firebase Hosting (arvela.fr).
# GitHub Pages n'est plus utilisé : le dépôt peut devenir privé.
# Les versions archivées ne sont jamais publiées.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version de travail (main)
        working-directory: main
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: main/dist
          retention-days: 3
  firebase:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARVELA_APP != '' }}
    steps:
      - name: Clé de déploiement présente ?
        if: env.HAS_KEY != 'true'
        run: echo "Pas encore de clé FIREBASE_SERVICE_ACCOUNT_ARVELA_APP dans les secrets du dépôt, publication Firebase sautée."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: main
      - uses: actions/download-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: site
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARVELA_APP }}
          projectId: arvela-app
          channelId: live

# Garde-fou : rien ne disparaît sans être annoncé (décision du DG du 21/11/2026).
# Tout fichier supprimé ou renommé par la demande doit être cité dans son corps,
# section « Suppressions voulues », sinon ce contrôle est rouge et la fusion bloquée.
name: Garde-fou
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  garde-fou-suppressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fichiers supprimés ou renommés
        env:
          CORPS: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Chemins exacts (espaces et accents gardés), un par ligne ; pour un renommage, l'ancien chemin.
          git -c core.quotePath=false diff -z --name-status --diff-filter=DR "$BASE"...HEAD \
            | python3 -c 'import sys; p=sys.stdin.buffer.read().split(b"\0"); i=0
          while i < len(p) and p[i]:
              s=p[i].decode(); print(p[i+1].decode()); i += 3 if s.startswith("R") else 2' > partis.txt
          if [ ! -s partis.txt ]; then echo "Aucun fichier supprimé ni renommé."; exit 0; fi
          # Lignes de la section « Suppressions voulues », nettoyées : puces, guillemets, accents graves, espaces de bord.
          printf '%s\n' "$CORPS" | tr -d '\r' | awk '/Suppressions voulues/{f=1;next} f' \
            | sed -E 's/^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]+//; s/`//g; s/[[:space:]]+(:|—|–|-)[[:space:]].*$//; s/^[[:space:]]+//; s/[[:space:]]+$//' > annonces.txt
          manque=0
          while IFS= read -r chemin; do
            if grep -qxF -- "$chemin" annonces.txt; then echo "Annoncé : $chemin"; else echo "::error::Supprimé ou renommé sans être annoncé : $chemin"; manque=1; fi
          done < partis.txt
          { echo "## Garde-fou"; echo; sed 's/^/- /' partis.txt; echo; echo "Chaque chemin doit être écrit seul sur une ligne de la section « Suppressions voulues », suivi au besoin de « : raison »."; } >> "$GITHUB_STEP_SUMMARY"
          exit $manque

# Aperçu de test de chaque demande de fusion, avant toute publication sur arvela.fr.
# Firebase publie la version proposée sur une adresse à part (arvela-app--pr<numéro>-….web.app),
# effacée au bout de 7 jours. L'adresse est ajoutée en commentaire de la demande de fusion.
# Limites de l'aperçu : App Check n'y tourne pas, et la connexion au compte y est refusée,
# car la clé Firebase n'accepte que arvela.fr. Il sert à vérifier les écrans, la démonstration et la règle CSP.
#
# Publication sans clé stockée (fédération d'identité de charge de travail, 04/11/2026) :
# GitHub prouve à Google que la demande vient de ce dépôt, Google rend un laissez-passer d'une heure
# pour le compte github-publication, qui n'a que le droit de publier le site.
name: Aperçu
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: apercu-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apercu:
    # Jamais pour une demande venue d'un dépôt copié : Google refuserait de toute façon son identité.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/371665732009/locations/global/workloadIdentityPools/github/providers/pilote-am
          service_account: github-publication@arvela-app.iam.gserviceaccount.com
      - name: Vérifier le laissez-passer Google
        run: gcloud auth print-access-token > /dev/null && echo "Laissez-passer obtenu"
      - name: Publier l'aperçu
        id: apercu
        run: |
          if ! npx --no-install firebase hosting:channel:deploy "pr${{ github.event.pull_request.number }}" \
            --expires 7d --project arvela-app --non-interactive --json > apercu.json; then
            cat apercu.json; grep -iE "error|denied|permission|token|credential" firebase-debug.log | tail -25; exit 1
          fi
          url=$(node -e "const r=require('./apercu.json'); const s=Object.values(r.result||{})[0]; if(!s||!s.url){console.error(JSON.stringify(r));process.exit(1)} console.log(s.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Aperçu::$url"
      - name: Écrire l'adresse dans la demande de fusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.apercu.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          corps="<!-- apercu-arvela -->
          **Aperçu de test** (effacé après 7 jours) : $URL

          La connexion au compte n'y marche pas, c'est normal : la clé Firebase n'accepte que arvela.fr."
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- apercu-arvela -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$corps" > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$corps" > /dev/null
          fi
